[build-system]
requires = [
    "scikit-build-core>=0.8",
    "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "ttorch"
version = "0.2.6"
description = "A lightweight C++ tensor and autograd library with Python bindings"
readme = "README.md"
authors = [
    { name = "TomNguyen", email = "tomnguyen6766@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["tensor", "autograd", "deep learning", "C++", "pybind11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.scikit-build]
minimum-version = "0.8"
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.packages = ["ttorch"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = "x86_64"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = "arm64 x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }